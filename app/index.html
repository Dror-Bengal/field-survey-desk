<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Field Survey Desk</title>

  <!-- PWA install metadata. Service worker is intentionally not registered yet
       (offline support is a future ticket); these tags only enable Add-to-
       Home-Screen on iOS and Android Chrome. -->
  <!-- Favicon swapped at runtime per route (App.jsx) so the surveyor tab
       and admin tab look distinct in the browser tab strip. The id hook
       is what App.jsx re-targets; the inline default is the surveyor icon
       so a fresh page paint doesn't flash the wrong glyph. -->
  <link id="favicon" rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d6e6e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='28' fill='white'%3EVS%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0d6e6e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Information Survey" />

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
